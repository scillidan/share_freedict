name: Release (eng-zho)

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full zip

    - name: (FreeDict eng-zho) Check latest eng-zho source version
      id: check_freedict_version
      run: |
        base_url="https://download.freedict.org/dictionaries/eng-zho/"
        html=$(curl -s -L -A "GitHub-Actions-CI" "$base_url")
        version=$(echo "$html" | grep -oP 'href="(\d{4}\.\d{2}\.\d{2}/)"' | grep -oP '\d{4}\.\d{2}\.\d{2}' | sort -V | tail -1)

        if [[ -z "$version" ]]; then
          echo "No FreeDict version found."
          exit 1
        fi
        echo "Latest FreeDict version found: $version"

        yyyymmdd=$(echo "$version" | sed 's/\.//g')
        echo "Using version: $yyyymmdd"

        if git rev-parse "refs/tags/$yyyymmdd" >/dev/null 2>&1; then
          echo "Tag $yyyymmdd already exists. Skipping."
          echo "should_continue=false" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "Tag $yyyymmdd does not exist. Proceeding with release."
          echo "TAG_NAME=$yyyymmdd" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=$yyyymmdd" >> $GITHUB_OUTPUT
          echo "FILE_VERSION=$yyyymmdd" >> $GITHUB_OUTPUT
          echo "should_continue=true" >> $GITHUB_OUTPUT
        fi

        tar_url="${base_url}${version}/freedict-eng-zho-${version}.src.tar.xz"
        if ! curl -LO "$tar_url" 2>/dev/null; then
          tar_url="${base_url}freedict-eng-zho-${version}.src.tar.xz"
          curl -LO "$tar_url" || exit 1
        fi

    - name: (FreeDict eng-zho) Extract and Rename FreeDict archive
      if: steps.check_freedict_version.outputs.should_continue == 'true'
      env:
        FILE_VERSION: ${{ steps.check_freedict_version.outputs.FILE_VERSION }}
      run: |
        original_version="${FILE_VERSION:0:4}.${FILE_VERSION:4:2}.${FILE_VERSION:6}"
        7z x "freedict-eng-zho-${original_version}.src.tar.xz" -o.
        7z x "freedict-eng-zho-${original_version}.src.tar" -o.
        mv eng-zho "freedict-eng-zho-${FILE_VERSION}"

    - name: Set up Python
      if: steps.check_freedict_version.outputs.should_continue == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install pyglossary
      if: steps.check_freedict_version.outputs.should_continue == 'true'
      run: pip install pyglossary lxml beautifulsoup4 python-idzip tqdm pyicu

    - name: Convert with pyglossary and python scripts
      if: steps.check_freedict_version.outputs.should_continue == 'true'
      env:
        FILE_VERSION: ${{ steps.check_freedict_version.outputs.FILE_VERSION }}
      run: |
        filename=freedict-eng-zho-${FILE_VERSION}
        dictname=FreeDict-eng-zho

        # tabfile
        pyglossary "${filename}/eng-zho.tei" ./_${filename}.txt --read-format=FreeDict --write-format=Tabfile

        # tabfile-formatted
        python text_format.py _${filename}.txt _${filename}-formatted.txt

        # stardict
        pyglossary ./_${filename}-formatted.txt ./${filename}-stardict --read-format=Tabfile --write-format=Stardict --name=${dictname}

        # tabfile-formatted-html2ansi
        python html2ansi.py _${filename}-formatted.txt _${filename}-formatted-html2ansi.txt

        # sdcv
        pyglossary ./_${filename}-formatted-html2ansi.txt ./${filename}-sdcv --read-format=Tabfile --write-format=Stardict --name=${dictname}

        # dictd
        pyglossary ./_${filename}-formatted-html2ansi.txt ./${filename}-dictd --read-format=Tabfile --write-format=DictOrg --write-options="dictzip=true" --name=${dictname}

        # yomichan
        pyglossary ./_${filename}-formatted.txt ./${filename}-yomichan.zip --read-format=Tabfile --write-format=Yomichan --name=${dictname}

        # aard2
        pyglossary ./_${filename}-formatted.txt ./${filename}-aard2.slob --read-format=Tabfile --write-format=Aard2Slob --name=${dictname}

    - name: ZIP stardict
      if: steps.check_freedict_version.outputs.should_continue == 'true'
      run: |
        for base in *.ifo; do
          prefix="${base%.ifo}"
          zip -j "${prefix}.zip" "$prefix".{ifo,dict,idx,syn} 2>/dev/null
        done

    - name: ZIP dictd
      if: steps.check_freedict_version.outputs.should_continue == 'true'
      run: |
        for base in *.index; do
          prefix="${base%.index}"
          zip -j "${prefix}.zip" "$prefix".{index,dict.dz} 2>/dev/null
        done

    - name: Generate SHA256 checksums
      if: steps.check_freedict_version.outputs.should_continue == 'true'
      run: |
        for file in *.{txt,zip,slob}; do
          sha256sum "$file" > "$file.sha256"
        done

    - name: Create GitHub Release
      if: steps.check_freedict_version.outputs.should_continue == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ steps.check_freedict_version.outputs.TAG_NAME }}
      run: |
        gh release create "$TAG_NAME" \
          *.txt *.zip *.slob \
          --title "$TAG_NAME" \
          --generate-notes
